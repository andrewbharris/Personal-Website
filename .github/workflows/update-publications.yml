name: Update publications from ORCID

# Mirrors the publication list on publications.html to Dr. Harris's ORCID
# record, using Crossref for the full citation details (author list, journal,
# volume, pages).
#
# Fully automatic: it commits and pushes straight to main, and GitHub Pages
# rebuilds the site about a minute later. No pull request, no approval step.
# ORCID is the source of truth - if a paper is not on ORCID, it will not be
# on the site.
#
# --allow-shrink is passed deliberately, so the list follows ORCID down as
# well as up. The MIN_EXPECTED floor inside the script still applies, so a
# broken or partial API response cannot wipe the page.
#
# Runs on the 1st of each month, and can be triggered by hand from the
# Actions tab with the "Run workflow" button.
#
# History: this used to scrape Google Scholar with the `scholarly` package.
# That never completed a successful run - Google blocks datacenter IPs, and
# the 2026-08-01 run hung for the full 6-hour Actions timeout. ORCID and
# Crossref are open APIs that do not block automated traffic.

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # a stuck fetch can never burn 6 hours again

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install needed - the script uses only the standard library.
      - name: Regenerate the publication list
        run: python3 scripts/update_publications.py --allow-shrink

      - name: Commit and push if the list changed
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain publications.html)" ]]; then
            echo "No changes to publications.html."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.html
          git commit -m "Update publications from ORCID"
          git push
          echo "Pushed to main. GitHub Pages will rebuild shortly."
