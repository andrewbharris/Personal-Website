name: Update publications from Google Scholar

# Keeps the publication list on publications.html in sync with Dr. Harris's
# Google Scholar profile. Runs on the 1st of each month, and can also be
# triggered by hand from the Actions tab (Run workflow).

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly

      - name: Regenerate publication list
        id: regen
        run: python scripts/update_publications.py
        continue-on-error: true   # a blocked Scholar fetch shouldn't fail the run

      - name: Commit changes if the list changed
        run: |
          if [[ -n "$(git status --porcelain publications.html)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add publications.html
            git commit -m "Auto-update publications from Google Scholar"
            git push
          else
            echo "No changes to publications.html."
          fi
