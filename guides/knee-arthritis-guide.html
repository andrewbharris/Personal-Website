document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"70109bce-d5d9-4753-b14a-8add4c39db99\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"43c6ff76-b829-41f6-8247-2376c597b460\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"73767c3a-d3de-49a5-a69a-31587249c453\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #E8E8E4; font-family: 'Work Sans', system-ui, sans-serif; color: #16233A; }\n  a { color: #3D6A9C; }\n  a:hover { color: #2A4E77; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"display:flex; justify-content:center; padding:24px 24px\">\n<div style=\"width:880px; background:#F8F7F3; border:1px solid #DCD8CE; box-shadow:0 2px 22px rgba(22,35,58,0.10); font-family:'Work Sans', sans-serif; color:#16233A\">\n  <div style=\"padding:26px 52px 18px; display:flex; align-items:center; gap:20px; border-bottom:2px solid #16233A\">\n    <img src=\"6ec4a2d8-55f2-4944-98f4-5d73cfaf3860\" alt=\"ABH\" style=\"width:60px; height:60px; display:block; flex:none\">\n    <div>\n      <div style=\"font-family:'Source Serif 4', serif; font-size:26px; font-weight:600; line-height:1.1; letter-spacing:-0.01em\">Andrew B. Harris, MD<\u002Fdiv>\n      <div style=\"font-size:11.5px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:#3D6A9C; margin-top:6px\">Hip &amp; Knee · Chicago<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:22px 52px 18px; border-bottom:1px solid #DCD8CE\">\n    <h1 style=\"font-family:'Source Serif 4', serif; font-size:38px; line-height:1.1; font-weight:600; margin:0 0 8px; letter-spacing:-0.015em\">Non-surgical care for knee arthritis<\u002Fh1>\n    <p style=\"margin:0 0 13px; font-size:14.5px; line-height:1.6; color:#3F4A5C; max-width:78ch\">The treatments below are grouped by how well each one is supported by current research studies and clinical guidelines. This reflects how confident doctors and scientists are that a treatment relieves knee arthritis pain, for people who are not yet ready for joint replacement surgery or are not candidates for it.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:8px\">\n      <div style=\"border:1px solid #C9CFD8; background:#FFFFFF\"><div style=\"background:#2E5E4E; color:#FFFFFF; font-size:13px; font-weight:600; padding:8px 13px; letter-spacing:0.04em; min-height:42px; display:flex; align-items:center; box-sizing:border-box\">Strongly supported<\u002Fdiv><div style=\"font-size:12.5px; color:#3F4A5C; padding:8px 13px 10px; line-height:1.45\">Research studies consistently show these help<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #C9CFD8; background:#FFFFFF\"><div style=\"background:#315982; color:#FFFFFF; font-size:13px; font-weight:600; padding:8px 13px; letter-spacing:0.04em; min-height:42px; display:flex; align-items:center; box-sizing:border-box\">Moderately supported<\u002Fdiv><div style=\"font-size:12.5px; color:#3F4A5C; padding:8px 13px 10px; line-height:1.45\">Research studies suggest these help, with less certainty<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #C9CFD8; background:#FFFFFF\"><div style=\"background:#55606F; color:#FFFFFF; font-size:13px; font-weight:600; padding:8px 13px; letter-spacing:0.04em; min-height:42px; display:flex; align-items:center; box-sizing:border-box\">Unlikely to be harmful<\u002Fdiv><div style=\"font-size:12.5px; color:#3F4A5C; padding:8px 13px 10px; line-height:1.45\">Research studies have not shown clear benefit, but the risk is low<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #C9CFD8; background:#FFFFFF\"><div style=\"background:#8C3B2E; color:#FFFFFF; font-size:13px; font-weight:600; padding:8px 13px; letter-spacing:0.04em; min-height:42px; display:flex; align-items:center; box-sizing:border-box\">Not recommended<\u002Fdiv><div style=\"font-size:12.5px; color:#3F4A5C; padding:8px 13px 10px; line-height:1.45\">Research studies show little or no help, or possible harm<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 52px\">\n    <div style=\"margin-top:18px; background:#2E5E4E; color:#FFFFFF; padding:9px 18px; display:flex; align-items:baseline; gap:16px\">\n      <span style=\"font-family:'Source Serif 4',serif; font-size:23px; font-weight:600; line-height:1.1; flex:none; white-space:nowrap\">Strongly supported<\u002Fspan>\n      <span style=\"font-size:13.5px; color:#FFFFFF\">Recommended for most people with knee arthritis<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column\">\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Exercise and physical therapy<\u002Fspan><span style=\"color:#3F4A5C\">Strengthening, balance work and low-impact activity: walking, a stationary bike, swimming, water classes, tai chi or yoga. A course of physical therapy is a reasonable way to learn the program before continuing it independently.&nbsp;<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Weight management<\u002Fspan><span style=\"color:#3F4A5C\">Each pound of body weight places several pounds of force across the knee when walking. Losing 5 to 10 percent of body weight reduces knee pain, and larger losses help more.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Anti-inflammatory gels (Voltaren)<\u002Fspan><span style=\"color:#3F4A5C\">Rubbed onto the knee. Ask your doctor before combining with other oral anti-inflammatory medications.&nbsp;<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Anti-inflammatory medications (NSAIDs)<\u002Fspan><span style=\"color:#3F4A5C\">Ibuprofen, naproxen, meloxicam, diclofenac, celecoxib and others. Taken at the lowest effective dose for the shortest period needed. Certain conditions may affect which one is most appropriate.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Acetaminophen (Tylenol)<\u002Fspan><span style=\"color:#3F4A5C\">Mild pain relief with few side effects at labeled doses. Can be taken on its own, alongside an anti-inflammatory medication, or when anti-inflammatory medications are not an option.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Arthritis education programs<\u002Fspan><span style=\"color:#3F4A5C\">Structured classes, often through a hospital system or outside programs, covering activity pacing, flare management, sleep and medication use.&nbsp;<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:18px; background:#315982; color:#FFFFFF; padding:9px 18px; display:flex; align-items:baseline; gap:16px\">\n      <span style=\"font-family:'Source Serif 4',serif; font-size:23px; font-weight:600; line-height:1.1; flex:none; white-space:nowrap\">Moderately supported<\u002Fspan>\n      <span style=\"font-size:13.5px; color:#FFFFFF\">Worth trying in addition to the treatments above. How much they help varies from person to person<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column\">\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Cortisone injections<\u002Fspan><span style=\"color:#3F4A5C\">Also called a steroid injection. Most people get a few weeks to a few months of relief. If a knee replacement is coming up, the injection should be at least three months before surgery.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Knee braces<\u002Fspan><span style=\"color:#3F4A5C\">An unloader brace shifts load off the worn side of the knee. A sleeve or hinged brace can help when the knee feels unstable.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Canes and walkers<\u002Fspan><span style=\"color:#3F4A5C\">Carried in the hand opposite the sore knee, a cane shifts roughly a quarter of body weight away from that joint with each step.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Heat and cold therapy<\u002Fspan><span style=\"color:#3F4A5C\">A heating pad before activity to loosen the joint, ice afterward to settle swelling and soreness.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Duloxetine<\u002Fspan><span style=\"color:#3F4A5C\">A prescription medication that acts on how the nervous system processes pain signals. Most useful when the pain has been there a long time or is spread beyond the knee.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Capsaicin creams<\u002Fspan><span style=\"color:#3F4A5C\">Made from chili pepper extract and applied to the skin. A burning sensation is common at first, and several weeks of regular use are usually needed before any effect.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:18px; background:#55606F; color:#FFFFFF; padding:9px 18px; display:flex; align-items:baseline; gap:16px\">\n      <span style=\"font-family:'Source Serif 4',serif; font-size:23px; font-weight:600; line-height:1.1; flex:none; white-space:nowrap\">Unlikely to be harmful<\u002Fspan>\n      <span style=\"font-size:13.5px; color:#FFFFFF\">Reasonable to try alongside other treatments if they appeal to you, though research studies have not shown a clear benefit<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column\">\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Acupuncture<\u002Fspan><span style=\"color:#3F4A5C\">Fine needles placed at specific points by a licensed practitioner, usually over several sessions.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Massage and manual therapy<\u002Fspan><span style=\"color:#3F4A5C\">Hands-on treatment of the knee and surrounding muscles by a therapist or massage therapist. Used alongside an exercise program rather than in place of one.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Supplements<\u002Fspan><span style=\"color:#3F4A5C\">Glucosamine, chondroitin, turmeric, ginger, fish oil, vitamin D, collagen and CBD products. Paid out of pocket and not regulated as prescription medications are, so dose and purity vary by brand. Some interact with other medications, including blood thinners, so review them with your pharmacist or physician.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Injections other than steroid medications<\u002Fspan><span style=\"color:#3F4A5C\">Gel (hyaluronic acid) shots, platelet-rich plasma and stem cell injections. Usually paid out of pocket, and preparation is not standardized between clinics. Serious side effects are uncommon.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Electrotherapy devices<\u002Fspan><span style=\"color:#3F4A5C\">TENS units, therapeutic ultrasound, low-level laser, magnetic field and shockwave treatment, usually given in a therapy office or bought as a home device.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #E2DED4; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Wedge shoe insoles<\u002Fspan><span style=\"color:#3F4A5C\">Insoles built up along the inner or outer edge to tilt the foot and shift load across the knee. Available over the counter or custom made.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Knee nerve procedures<\u002Fspan><span style=\"color:#3F4A5C\">Radiofrequency ablation heats the small sensory nerves around the knee; genicular artery embolization blocks small arteries feeding the joint lining. Both remain under study and are not part of standard care.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin:18px 52px 0; border:2px solid #8C3B2E; background:#FBF4F2\">\n    <div style=\"background:#8C3B2E; color:#FFFFFF; padding:9px 18px; display:flex; align-items:baseline; gap:16px\">\n      <span style=\"font-family:'Source Serif 4',serif; font-size:23px; font-weight:600; line-height:1.1; flex:none; white-space:nowrap\">Not recommended<\u002Fspan>\n      <span style=\"font-size:13.5px; color:#FFFFFF\">Research studies show these do not help, or that the risks outweigh any benefit<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:4px 20px 10px; display:flex; flex-direction:column\">\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #EDE0DC; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Long-term opioid medications<\u002Fspan><span style=\"color:#4A5566\">Including tramadol. Pain relief fades with continued use, while drowsiness, constipation, falls and dependence accumulate.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; border-bottom:1px solid #EDE0DC; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Arthroscopy for arthritis<\u002Fspan><span style=\"color:#4A5566\">Trimming or cleaning out the joint through small incisions. In an arthritic knee it does not reduce pain or improve motion, and it carries the risks and recovery of surgery.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:20px; padding:8px 0; font-size:14.5px; line-height:1.4\"><span style=\"width:230px; flex:none; font-weight:600\">Needle lavage<\u002Fspan><span style=\"color:#4A5566\">Flushing the joint with saline through a needle. It changes neither pain nor motion in an arthritic knee.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:18px 52px 26px; font-size:11px; line-height:1.5; color:#5B6675\">\n    <div style=\"letter-spacing:0.14em; text-transform:uppercase; color:#16233A; font-weight:600; margin-bottom:6px; font-size:11px\">Guidelines referenced<\u002Fdiv>\n    <div style=\"display:flex; flex-wrap:wrap; column-gap:12px; row-gap:2px; font-size:10.5px; line-height:1.5; color:#5B6675\"><span style=\"border-right:1px solid #C9CFD8; padding-right:12px\">AAOS. Knee OA, Non-Arthroplasty, 3rd ed, 2021<\u002Fspan><span style=\"border-right:1px solid #C9CFD8; padding-right:12px\">AAOS. Surgical Management of Knee OA, 2022<\u002Fspan><span style=\"border-right:1px solid #C9CFD8; padding-right:12px\">AAOS. Hip OA, 2023<\u002Fspan><span style=\"border-right:1px solid #C9CFD8; padding-right:12px\">ACR / Arthritis Foundation. Hand, Hip &amp; Knee OA, 2019<\u002Fspan><span style=\"border-right:1px solid #C9CFD8; padding-right:12px\">ACR / AAHKS. Timing of Hip &amp; Knee Arthroplasty, 2023<\u002Fspan><span style=\"border-right:1px solid #C9CFD8; padding-right:12px\">VA / DoD. Non-Surgical Hip &amp; Knee OA, 2026<\u002Fspan><span style=\"border-right:1px solid #C9CFD8; padding-right:12px\">NICE NG226. Osteoarthritis in Over 16s, 2022<\u002Fspan><span style=\"border-right:1px solid #C9CFD8; padding-right:12px\">OARSI. Non-Surgical Knee, Hip &amp; Polyarticular OA, 2019<\u002Fspan><span style=\"border-right:1px solid #C9CFD8; padding-right:12px\">EULAR. Non-Pharmacologic Core Management, 2023<\u002Fspan><span>APTA. Hip OA, 2025<\u002Fspan><\u002Fdiv>\n    <div style=\"margin-top:10px; border-top:1px solid #DCD8CE; padding-top:9px; font-size:12px\">This handout is general information and is not a substitute for individual medical advice. Every treatment listed here carries its own risks, interactions and dosing considerations, and what is appropriate depends on your other medical conditions and medications. Discuss any medication, injection, supplement or device with your physician or pharmacist before starting it. If pain and loss of function continue despite these treatments, ask your physician whether knee replacement is a reasonable next step.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
